<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرض الأعمال | بورتفوليو</title>
  <!-- خط تجوال والتنسيق السريع -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- ترويسة الموقع والتعريف -->
  <header class="max-w-5xl mx-auto px-6 pt-16 pb-12 text-center">
    <div class="w-24 h-24 mx-auto mb-4 rounded-full bg-blue-600 text-white flex items-center justify-center text-3xl font-extrabold shadow-lg">
      م
    </div>
    <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-3">مرحباً، أنا مصمم ومطور تطبيقات</h1>
    <p class="text-slate-600 max-w-xl mx-auto text-base md:text-lg leading-relaxed">
      أصمم واجهات التطبيقات، وأنسق وأخرج الكتب الرقمية والمطبوعة، وأطور حلولاً برمجية وتصاميم حديثة.
    </p>
    <div class="mt-6 flex justify-center gap-3">
      <a href="admin/" target="_blank" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-lg text-sm font-bold transition">دخول لوحة التحكم</a>
    </div>
  </header>

  <!-- قسم المشاريع -->
  <main class="max-w-5xl mx-auto px-6 pb-20">
    <div class="flex items-center justify-between border-b border-slate-200 pb-4 mb-8">
      <h2 class="text-2xl font-bold text-slate-900">أحدث الأعمال والمشاريع</h2>
    </div>

    <!-- شبكة عرض المشاريع تلقائياً -->
    <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-slate-500 text-sm">جاري جلب المشاريع...</p>
    </div>
  </main>

  <!-- سكربت قراءة المشاريع تلقائياً -->
  <script>
    fetch('projects.json')
      .then(res => res.json())
      .then(data => {
        const grid = document.getElementById('projects-grid');
        if (data.length === 0) {
          grid.innerHTML = '<p class="text-slate-500 text-sm">لا توجد مشاريع مضافة بعد.</p>';
          return;
        }
        grid.innerHTML = data.map(item => `
          <div class="bg-white rounded-2xl overflow-hidden border border-slate-200 shadow-sm hover:shadow-md transition">
            <img src="${item.image}" alt="${item.title}" class="w-full h-48 object-cover bg-slate-100">
            <div class="p-5">
              <span class="inline-block px-2.5 py-1 bg-blue-50 text-blue-700 text-xs font-bold rounded-md mb-2">${item.category}</span>
              <h3 class="text-lg font-bold text-slate-900 mb-2">${item.title}</h3>
              <p class="text-slate-600 text-sm mb-4 line-clamp-3">${item.description}</p>
              ${item.link ? `<a href="${item.link}" target="_blank" class="text-sm font-bold text-blue-600 hover:text-blue-700 inline-flex items-center gap-1">معاينة العمل &larr;</a>` : ''}
            </div>
          </div>
        `).join('');
      })
      .catch(() => {
        document.getElementById('projects-grid').innerHTML = '<p class="text-slate-500 text-sm">أضف أول مشروع من لوحة التحكم ليظهر هنا.</p>';
      });
  </script>
</body>
</html>
