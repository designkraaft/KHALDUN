media:
  input: images
  output: images

content:
  - name: projects
    label: المشاريع والكتب
    type: collection
    path: content/projects
    format: json
    fields:
      - name: title
        label: عنوان المشروع أو الكتاب
        type: string
        required: true
      - name: category
        label: القسم
        type: select
        options:
          - كتب
          - تطبيقات
          - تصاميم واجهات
          - أعمال أخرى
      - name: image
        label: صورة الغلاف أو لقطة الشاشة
        type: image
      - name: description
        label: وصف موجز
        type: text
      - name: link
        label: رابط المعاينة (اختياري)
        type: string